[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "setselector"
authors = [{ name = "Tom Schmidt" },{ name = "Marius Lindauer"}]
description = "Benchmark-Set-Selection-Tool."
requires-python = ">=3.12"
license = { file = "LICENSE" }
dynamic = ["version"]
readme = "README.md"

[project.urls]
Homepage = "https://potassco.org"
Repository = "https://github.com/potassco/benchmark-set-selection-tool"
Issues = "https://github.com/potassco/benchmark-set-selection-tool/issues"

[project.optional-dependencies]
lint = ["ruff"]
typecheck = ["pytest", "ty"]
test = ["pytest", "pytest-cov", "coverage[toml]"]
doc = ["zensical", "mkdocstrings-python"]
dev = ["setselector[test,typecheck,lint]"]

[project.scripts]
setselector = "setselector.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_scheme = "python-simplified-semver"
local_scheme = "no-local-version"

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = [
    "/usr/**",
    "**/site-packages/**",
    "**/node_modules/**",
    "**/typeshed-fallback/**",
]

[tool.ruff.lint]
extend-select = ["I", "E", "F", "B", "C4", "D", "ARG", "SIM", "ANN", "Q"]
ignore = [
    "E741",
    "D200",
    "D203",
    "D212",
    "D413",
    "B023", # broken lint
]

[tool.ruff.lint.per-file-ignores]
"noxfile.py" = ["ANN"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.coverage.run]
source = ["setselector", "tests"]
omit = ["*/setselector/__main__.py", "*/setselector/utils/logging.py", "tests/*", "*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "raise NotImplementedError",
    "raise TypeError",
    "nocoverage",
    "assert",
    "\\.\\.\\.",
]
